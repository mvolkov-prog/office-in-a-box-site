<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Офис в коробке</title>
<meta name="description" content="Пиксельный офис на рабочем столе: сотрудницы живут своей жизнью и делают задачи через Claude Code, Codex или любую модель.">
<meta name="theme-color" content="#cfeeff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Cpath fill='%23e0642a' d='M1 0h1v1h1v1h2V1h1V0h1v4H1z'/%3E%3Cpath fill='%23f6d3bd' d='M2 3h4v3H2z'/%3E%3Cpath fill='%2326304a' d='M3 4h1v1H3zM5 4h1v1H5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#how" data-i18n="nav.how">Как это</a>
<nav class="top" aria-label="Меню">
  <a class="brand" href="#top">
    <canvas id="brandCv" width="48" height="48" aria-hidden="true"></canvas>
    <span class="px" data-i18n="brand">Офис в коробке</span>
  </a>
  <div class="links">
    <a href="#how" data-i18n="nav.how">Как это</a>
    <a href="#hire" data-i18n="nav.hire">Нанять</a>
    <a href="#price" data-i18n="nav.price">Цены</a>
    <a href="#faq" data-i18n="nav.faq">Вопросы</a>
  </div>
  <div class="toggles">
    <div class="seg" role="group" aria-label="Язык / Language">
      <button type="button" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <div class="seg" role="group" aria-label="Тон / Tone">
      <button type="button" data-tone="cozy" aria-pressed="true" data-i18n="tone.cozy">Уютно</button>
      <button type="button" data-tone="bold" aria-pressed="false" data-i18n="tone.bold">Смелее</button>
    </div>
  </div>
</nav>

<div class="sky" aria-hidden="true"><div id="sunSlot"></div><div class="clouds" id="clouds"></div></div>

<main>
<header class="hero" id="top">
  <div class="hero-copy">
    <h1 class="px" data-perch data-i18n="hero.title">Твой рабочий стол наконец-то заселили</h1>
    <p class="lead" data-i18n="hero.lead"></p>
    <div class="btns">
      <a class="btn big" href="#hire" data-i18n="hero.hire">Нанять первую</a>
      <span class="btn ghost" aria-disabled="true"><span data-i18n="hero.download">Скачать</span> <small data-i18n="hero.soon">скоро</small></span>
    </div>
    <p class="meta" data-i18n="hero.meta"></p>
    <p class="hint"><span id="hintCup"></span><span data-i18n="hero.hint"></span></p>
  </div>
  <figure class="frame" id="heroFrame" data-perch>
    <div class="office" id="heroOffice"></div>
    <figcaption class="note-tag" data-i18n="hero.frame"></figcaption>
  </figure>
</header>

<section class="how" id="how">
  <h2 class="px" data-perch data-i18n="how.title">Не чат. Коллеги.</h2>
  <div class="how-grid">
    <div class="notes">
      <article class="note n1" data-perch><h3 class="px" data-i18n="how.life.t"></h3><p data-i18n="how.life.p"></p></article>
      <article class="note n2"><h3 class="px" data-i18n="how.memory.t"></h3><p data-i18n="how.memory.p"></p></article>
      <article class="note n3"><h3 class="px" data-i18n="how.work.t"></h3><p data-i18n="how.work.p"></p></article>
    </div>
    <div class="chat" data-perch>
      <div class="chat-bar"><canvas class="ava" width="48" height="48" aria-hidden="true"></canvas><b class="px" data-i18n="chat.title"></b></div>
      <ul id="msgs">
        <li class="me"><span data-i18n="chat.me1"></span></li>
        <li class="her"><span data-i18n="chat.y1"></span></li>
        <li class="tool"><span data-i18n="chat.tool1"></span></li>
        <li class="tool"><span data-i18n="chat.tool2"></span></li>
        <li class="her"><span data-i18n="chat.y2"></span></li>
        <li class="me"><span data-i18n="chat.me2"></span></li>
        <li class="her"><span data-i18n="chat.y3"></span></li>
      </ul>
    </div>
  </div>
  <p class="engines" data-i18n="engines"></p>
</section>

<section class="hire" id="hire">
  <div class="hire-head">
    <h2 class="px" data-perch data-i18n="hire.title">Отдел кадров</h2>
    <p data-i18n="hire.p"></p>
  </div>
  <div class="hire-grid">
    <figure class="badge" data-perch>
      <div class="badge-top"><span class="px" data-i18n="hire.badge">Пропуск</span><span class="px" id="badgeNo">№ 007</span></div>
      <div class="photo"><canvas id="hireCv" width="48" height="48" aria-hidden="true"></canvas></div>
      <figcaption>
        <label class="sr" for="hireName" data-i18n="hire.name">Имя</label>
        <input id="hireName" class="name px" value="Искорка" maxlength="16" spellcheck="false">
        <span class="role"><span data-i18n="hire.role">Должность</span>: <b id="hireRole"></b></span>
      </figcaption>
    </figure>
    <div class="form">
      <fieldset><legend data-i18n="hire.kind"></legend>
        <div class="chips" data-k="kind">
          <button type="button" class="chip" data-v="fox" data-i18n="kind.fox"></button>
          <button type="button" class="chip" data-v="cat" data-i18n="kind.cat"></button>
          <button type="button" class="chip" data-v="bunny" data-i18n="kind.bunny"></button>
          <button type="button" class="chip" data-v="wolf" data-i18n="kind.wolf"></button>
        </div>
      </fieldset>
      <fieldset><legend data-i18n="hire.outfit"></legend>
        <div class="chips" data-k="outfit">
          <button type="button" class="chip" data-v="office" data-i18n="outfit.office"></button>
          <button type="button" class="chip" data-v="hoodie" data-i18n="outfit.hoodie"></button>
          <button type="button" class="chip" data-v="dress" data-i18n="outfit.dress"></button>
          <button type="button" class="chip" data-v="sport" data-i18n="outfit.sport"></button>
        </div>
      </fieldset>
      <fieldset><legend data-i18n="hire.hair"></legend>
        <div class="chips" data-k="style">
          <button type="button" class="chip" data-v="bob" data-i18n="hair.bob"></button>
          <button type="button" class="chip" data-v="long" data-i18n="hair.long"></button>
          <button type="button" class="chip" data-v="twin" data-i18n="hair.twin"></button>
          <button type="button" class="chip" data-v="pony" data-i18n="hair.pony"></button>
        </div>
      </fieldset>
      <fieldset><legend data-i18n="hire.color"></legend><div class="swatches" id="swatches"></div></fieldset>
      <div class="actions">
        <button type="button" class="btn big" id="hireBtn" data-i18n="hire.do">Нанять</button>
        <button type="button" class="btn ghost" id="randBtn" data-i18n="hire.rand">Случайная</button>
      </div>
      <p class="toast" id="toast" role="status" aria-live="polite"></p>
    </div>
  </div>
</section>

<section class="price" id="price">
  <h2 class="px" data-perch data-i18n="price.title"></h2>
  <p class="price-p" data-i18n="price.p"></p>
  <div class="tiers">
    <article class="tier t-px" data-perch>
      <canvas id="tierPx" width="48" height="48" aria-hidden="true"></canvas>
      <h3 class="px" data-i18n="tier.px"></h3>
      <p class="price-n"><b data-i18n="tier.px.price"></b> <span class="tag" data-i18n="tier.px.tag"></span></p>
      <ul data-i18n-list="tier.px.l"></ul>
    </article>
    <article class="tier t-hd" data-perch>
      <canvas id="tierHd" width="48" height="48" aria-hidden="true"></canvas>
      <h3 class="px" data-i18n="tier.hd"></h3>
      <p class="price-n"><b data-i18n="tier.hd.price"></b> <span class="tag" data-i18n="tier.hd.tag"></span></p>
      <ul data-i18n-list="tier.hd.l"></ul>
    </article>
    <article class="tier t-art" data-perch>
      <img src="../assets/iskra-drawn.png" alt="" width="640" height="640" loading="lazy">
      <h3 class="px" data-i18n="tier.art"></h3>
      <p class="price-n"><b data-i18n="tier.art.price"></b> <span class="tag" data-i18n="tier.art.tag"></span></p>
      <ul data-i18n-list="tier.art.l"></ul>
    </article>
  </div>
</section>

<section class="faq" id="faq">
  <h2 class="px" data-perch data-i18n="faq.title">Вопросы</h2>
  <div class="faq-list" data-perch>
    <details><summary data-i18n="faq.q1"></summary><p data-i18n="faq.a1"></p></details>
    <details><summary data-i18n="faq.q2"></summary><p data-i18n="faq.a2"></p></details>
    <details><summary data-i18n="faq.q3"></summary><p data-i18n="faq.a3"></p></details>
    <details><summary data-i18n="faq.q4"></summary><p data-i18n="faq.a4"></p></details>
  </div>
</section>
</main>

<footer class="foot" data-perch>
  <div class="office" id="footOffice"></div>
  <p data-i18n="footer"></p>
</footer>

<div class="roam" id="roam" aria-hidden="true"></div>
<canvas class="fx" id="fx" aria-hidden="true"></canvas>
<script type="module" src="landing.js"></script>
</body>
</html>
